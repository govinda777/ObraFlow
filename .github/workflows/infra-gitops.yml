name: Infrastructure GitOps (Plan & Apply)

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-gitops.yml'
  push:
    branches:
      - "main"
      - "develop"
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-gitops.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      action:
        description: 'OpenTofu Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: infra-gitops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-env:
    name: Resolve Target Environment
    runs-on: ubuntu-24.04
    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
      action: ${{ steps.resolve.outputs.action }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env_name=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "action=apply" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "action=apply" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "action=plan" >> $GITHUB_OUTPUT
          fi

  opentofu:
    name: OpenTofu (${{ needs.determine-env.outputs.env_name }} - ${{ needs.determine-env.outputs.action }})
    needs: determine-env
    runs-on: ubuntu-24.04
    environment: ${{ needs.determine-env.outputs.env_name }}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      STATE_DATABASE_URL: ${{ secrets.STATE_DATABASE_URL }}
      TARGET_ENV: ${{ needs.determine-env.outputs.env_name }}
      ACTION: ${{ needs.determine-env.outputs.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.5

      # 1. NEON
      - name: OpenTofu Init (Neon)
        run: |
          tofu -chdir=infra/terraform/neon init \
            -backend-config="conn_str=${STATE_DATABASE_URL}" \
            -backend-config="schema_name=tofu_state_neon_${TARGET_ENV}" \
            -reconfigure

      - name: OpenTofu Plan (Neon)
        id: plan-neon
        run: |
          tofu -chdir=infra/terraform/neon plan \
            -var-file=environments/${TARGET_ENV}.tfvars \
            -no-color

      - name: OpenTofu Apply (Neon)
        if: env.ACTION == 'apply'
        run: |
          tofu -chdir=infra/terraform/neon apply \
            -var-file=environments/${TARGET_ENV}.tfvars \
            -auto-approve

      - name: OpenTofu Destroy (Neon)
        if: env.ACTION == 'destroy'
        run: |
          tofu -chdir=infra/terraform/neon destroy \
            -var-file=environments/${TARGET_ENV}.tfvars \
            -auto-approve

      # 2. VERCEL
      - name: OpenTofu Init (Vercel)
        run: |
          tofu -chdir=infra/terraform/vercel init \
            -backend-config="conn_str=${STATE_DATABASE_URL}" \
            -backend-config="schema_name=tofu_state_vercel_${TARGET_ENV}" \
            -reconfigure

      - name: OpenTofu Plan (Vercel)
        id: plan-vercel
        run: |
          tofu -chdir=infra/terraform/vercel plan \
            -var-file=environments/${TARGET_ENV}.tfvars \
            -no-color

      - name: OpenTofu Apply (Vercel)
        if: env.ACTION == 'apply'
        run: |
          tofu -chdir=infra/terraform/vercel apply \
            -var-file=environments/${TARGET_ENV}.tfvars \
            -auto-approve

      - name: OpenTofu Destroy (Vercel)
        if: env.ACTION == 'destroy'
        run: |
          tofu -chdir=infra/terraform/vercel destroy \
            -var-file=environments/${TARGET_ENV}.tfvars \
            -auto-approve
