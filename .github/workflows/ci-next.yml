name: Next.js verification

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm run test:unit

      - name: BDD tests
        run: npm run test:bdd

      - name: Database migrations, RLS, and audit tests
        run: npm run test:db

      - name: Typecheck
        run: npm run typecheck:web

      - name: Next.js production build
        run: npm run build:web

      - name: Health routes integration test
        run: npm run test:health:routes

      - name: Check Neon IaC formatting
        run: tofu -chdir=infra/terraform/neon fmt -check -recursive

      - name: Initialize Neon providers without backend
        run: tofu -chdir=infra/terraform/neon init -backend=false -input=false -lockfile=readonly

      - name: Validate Neon IaC
        run: tofu -chdir=infra/terraform/neon validate

      - name: Check Vercel IaC formatting
        run: tofu -chdir=infra/terraform/vercel fmt -check -recursive

      - name: Initialize Vercel providers without backend
        run: tofu -chdir=infra/terraform/vercel init -backend=false -input=false -lockfile=readonly

      - name: Validate Vercel IaC
        run: tofu -chdir=infra/terraform/vercel validate

      - name: Test Neon and Vercel IaC security invariants
        run: npm run test:iac
