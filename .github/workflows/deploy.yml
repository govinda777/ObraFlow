name: Deploy ObraFlow to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'pages/**'
      - 'sources/**'
      - 'components/**'
      - 'evidence.plugins.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v6

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build DuckDB Sources
        run: npm run sources

      - name: Build Static Site
        run: npm run build

      - name: Disable Jekyll (_app directory support)
        run: touch ./build/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
