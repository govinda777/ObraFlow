# Workflow para compilar os relatórios do Evidence.dev + DuckDB e publicar no GitHub Pages
name: Deploy Evidence Reports to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure basePath for GitHub Pages (/ObraFlow)
        run: |
          printf "\ndeployment:\n  basePath: /ObraFlow\n" >> evidence.config.yaml

      - name: Install dependencies
        run: npm ci

      - name: Build DuckDB sources from mock_data
        run: npm run sources

      - name: Build static Evidence site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
